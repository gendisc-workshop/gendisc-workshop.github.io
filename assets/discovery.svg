<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Generative discovery through exploration and experimental feedback</title>
  <desc id="desc">Generative models explore beyond known data to propose new candidates. Experiments evaluate selected candidates and provide feedback for further generation.</desc>
  <defs>
    <radialGradient id="field">
      <stop stop-color="#e5ecdb" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e5ecdb" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m1.5 1 4 3-4 3" fill="none" stroke="#597358" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <ellipse cx="251" cy="219" rx="244" ry="199" fill="url(#field)"/>

  <!-- The training distribution and its sampled structures. -->
  <g stroke="#b5c4aa" stroke-width="1.3">
    <circle cx="144" cy="204" r="90" stroke-dasharray="4 7"/>
    <circle cx="144" cy="204" r="66" opacity=".65"/>
    <circle cx="144" cy="204" r="43" opacity=".75"/>
    <circle cx="144" cy="204" r="22" opacity=".85"/>
  </g>
  <g fill="#708766">
    <circle cx="101" cy="166" r="3"/><circle cx="126" cy="146" r="2.6"/>
    <circle cx="161" cy="155" r="3.2"/><circle cx="187" cy="179" r="2.7"/>
    <circle cx="87" cy="203" r="2.8"/><circle cx="113" cy="191" r="3.6"/>
    <circle cx="139" cy="177" r="3.3"/><circle cx="159" cy="187" r="3.8"/>
    <circle cx="132" cy="209" r="4"/><circle cx="109" cy="227" r="3.3"/>
    <circle cx="154" cy="229" r="3.5"/><circle cx="187" cy="219" r="3.1"/>
    <circle cx="203" cy="194" r="2.7"/><circle cx="95" cy="244" r="2.5"/>
    <circle cx="132" cy="255" r="3"/><circle cx="174" cy="260" r="2.6"/>
    <circle cx="173" cy="206" r="3.2"/><circle cx="149" cy="200" r="3"/>
  </g>

  <!-- Branching trajectories reach beyond the initial training distribution. -->
  <g stroke-width="2" stroke-linecap="round">
    <path d="M153 213C209 202 210 125 274 119S315 99 344 93" stroke="#486b49"/>
    <path d="M153 213C224 230 252 170 313 177S368 167 403 161" stroke="#315e40"/>
    <path d="M153 213C197 267 259 256 285 243S314 230 337 230" stroke="#9b7b50"/>
  </g>
  <g fill="#fcfcf8" stroke-width="1.5">
    <circle cx="245" cy="132" r="5" stroke="#486b49"/>
    <circle cx="281" cy="179" r="5" stroke="#315e40"/>
    <circle cx="254" cy="253" r="5" stroke="#9b7b50"/>
  </g>
  <g stroke="#315e40">
    <circle cx="344" cy="93" r="13" stroke-width="1.2" opacity=".5"/>
    <circle cx="344" cy="93" r="5.5" fill="#486b49" stroke="none"/>
    <circle cx="403" cy="161" r="17" stroke-width="1.3"/>
    <circle cx="403" cy="161" r="7" fill="#315e40" stroke="none"/>
  </g>
  <circle cx="337" cy="230" r="16" fill="#f6eddc"/>
  <path d="m337 218 4 7 8 5-8 5-4 7-4-7-8-5 8-5Z" fill="#ba8543"/>

  <!-- Selected candidates are tested; the return path stays clear of every label. -->
  <g stroke="#597358" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M423 173C469 204 476 264 442 308"/>
    <path d="M322 367C213 417 31 394 72 272"/>
  </g>

  <!-- Measurements with uncertainty represent experimental evidence across domains. -->
  <rect x="338" y="323" width="123" height="87" rx="8" fill="#fcfcf8" stroke="#afbea3" stroke-width="1.3"/>
  <path d="M353 337V393H449" stroke="#b7c3ad" stroke-width="1.2"/>
  <g stroke="#82966f" stroke-width="1.5" stroke-linecap="round">
    <path d="M373 352V382M368 352H378M368 382H378"/>
    <path d="M399 344V369M394 344H404M394 369H404"/>
    <path d="M429 339V358M424 339H434M424 358H434"/>
  </g>
  <g fill="#315e40">
    <circle cx="373" cy="368" r="4"/><circle cx="399" cy="357" r="4"/>
  </g>
  <circle cx="429" cy="349" r="4" fill="#ba8543"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#31543f">
    <text x="351" y="49">New candidates</text>
    <text x="144" y="322">Known data</text>
    <text x="399" y="442">Experiments</text>
    <text x="181" y="444" font-size="18" font-weight="400" fill="#597358">Feedback</text>
  </g>
</svg>
